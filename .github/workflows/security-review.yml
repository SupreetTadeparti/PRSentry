name: AI Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs don't get secrets, so skip them instead of failing
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit to compute the diff

      # In another repo, use: <your-username>/AIPRChecker@v1
      - uses: ./
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ vars.LLM_BASE_URL || 'https://api.ai.it.ufl.edu/v1' }}
          llm-model: ${{ vars.LLM_MODEL || 'gpt-4o' }}
          # To use Claude instead: llm-provider: anthropic, llm-model: claude-opus-5-5
